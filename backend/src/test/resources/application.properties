# Settings used ONLY when running the automated tests (mvnw test).
# This file replaces the main application.properties during tests, so it must contain everything needed.
# Tests use their OWN database, bms_test, so your real bms data is never touched.
spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/bms_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
